name: Deploy MindersMall to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build
        env:
          VITE_BRAZE_API_KEY: ${{ secrets.VITE_BRAZE_API_KEY }}
          VITE_BRAZE_SDK_ENDPOINT: ${{ secrets.VITE_BRAZE_SDK_ENDPOINT }}

      # Fallback SPA para GitHub Pages: al recargar una ruta interna
      # (ej. /MindersMall/messages) Pages busca ese archivo y devuelve 404.
      # Sirviendo index.html como 404.html, React Router toma el control
      # y la ruta carga bien incluso con refresh o enlace directo.
      - name: SPA fallback (404.html)
        run: cp dist/index.html dist/404.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
