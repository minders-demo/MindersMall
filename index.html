<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Minders Demo</title>

    <!-- Redirección inmediata a MindersMall.
         Cubre pushes de test de Braze, links directos al dominio raíz,
         y cualquier aterrizaje en minders-demo.github.io -->
    <meta http-equiv="refresh" content="0; url=/MindersMall/" />
    <script>
      // Respaldo por JS (más rápido que el meta refresh en la mayoría de navegadores)
      window.location.replace('/MindersMall/');
    </script>

    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #050505;
        color: #fff;
        font-family: system-ui, -apple-system, sans-serif;
      }
      .box { text-align: center; }
      .logo {
        font-size: 28px;
        font-weight: 800;
        letter-spacing: 0.5px;
        margin-bottom: 12px;
      }
      .logo span { color: #6366f1; font-style: italic; }
      a { color: #818cf8; text-decoration: none; font-weight: 600; }
      a:hover { text-decoration: underline; }
      p { color: #a1a1aa; font-size: 14px; }
    </style>
  </head>
  <body>
    <!-- Respaldo visible por si el navegador bloquea la redirección -->
    <div class="box">
      <div class="logo">MINDERS <span>MALL</span></div>
      <p>Redirigiendo… si no avanza automáticamente,
        <a href="/MindersMall/">haz clic aquí</a>.
      </p>
    </div>
  </body>
</html>
